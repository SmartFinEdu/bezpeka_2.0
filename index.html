                                { text: "Б) Залишити телефон на дорозі і йти далі, життя дорожче.", correct: false, reason: "Це безпечно, але телефон можна врятувати правильними діями." },
                                { text: "В) Зупинитися, підняти руку, щоб привернути увагу водіїв, переконатися, що авто стоять, і тільки тоді підняти.", correct: true, reason: "Правильно. Головне — встановити зоровий контакт з водіями і зробити себе видимим." }
                            ]

                        ${generateQuiz(5, "🚌 Ситуація 5: «Трамвайна пастка»", 
                            "Ви вийшли з автобуса або трамвая. Вам потрібно перейти на інший бік вулиці. Як це зробити?",
                            [
                                { text: "А) Обійти автобус спереду, а трамвай ззаду.", correct: false, reason: "Це старе і дуже небезпечне правило! Через габарити транспорту ви не бачите дорогу, а водії не бачать вас." },
                                { text: "Б) Зачекати, поки транспорт від'їде, або дійти до найближчого пішохідного переходу.", correct: true, reason: "Правильно! Тільки на відкритій ділянці або на переході можна безпечно перетинати дорогу." },
                                { text: "В) Визирнути з-за автобуса і швидко перебігти дорогу.", correct: false, reason: "Небезпечно! Вас може збити авто, що рухається в сусідній смузі." }
                            ]
                        )}
                    </div>
                `
            },
            {
                id: 6,
                title: "6. Екстрена валіза",
                icon: "🚑",
                render: () => `
                    <div class="fade-in max-w-4xl mx-auto">
                        <h2 class="text-3xl md:text-4xl font-bold text-slate-800 mb-6 flex items-center gap-3">
                            🚑 Блок 6. Екстрена валіза знань
                        </h2>
                        <p class="text-xl text-slate-600 mb-8 bg-white p-5 rounded-xl border border-slate-200">
                            Що робити у разі ДТП? (Якщо збили вас, друга, або ви зачепили когось на самокаті).
                        </p>

                        <div class="space-y-6">
                            
                            <div class="flex flex-col sm:flex-row gap-6 p-6 bg-white border-2 border-slate-200 rounded-3xl shadow-sm relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-2 bg-red-500"></div>
                                <div class="text-5xl sm:w-20 text-center">🛑</div>
                                <div class="flex-1">
                                    <h3 class="font-bold text-2xl text-slate-800 mb-2">1. Не панікувати і не тікати</h3>
                                    <p class="text-lg text-slate-600">Залишення місця ДТП — це серйозне правопорушення. Відповідати доведеться суворіше.</p>
                                </div>
                            </div>

                            <div class="flex flex-col sm:flex-row gap-6 p-6 bg-white border-2 border-slate-200 rounded-3xl shadow-sm relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-2 bg-blue-500"></div>
                                <div class="text-5xl sm:w-20 text-center">📞</div>
                                <div class="flex-1">
                                    <h3 class="font-bold text-2xl text-slate-800 mb-2">2. Викликати допомогу</h3>
                                    <p class="text-lg text-slate-600 mb-4">Відійдіть на безпечну відстань (якщо можете) і одразу телефонуйте:</p>
                                    <div class="flex flex-wrap gap-4">
                                        <span class="inline-flex items-center gap-2 px-6 py-3 bg-red-100 text-red-800 rounded-2xl font-black text-xl border border-red-200 shadow-sm">🚨 103 (Швидка)</span>
                                        <span class="inline-flex items-center gap-2 px-6 py-3 bg-blue-100 text-blue-800 rounded-2xl font-black text-xl border border-blue-200 shadow-sm">🚓 112 або 102</span>
                                    </div>
                                    <p class="text-sm text-slate-500 mt-3 font-semibold">* Навіть якщо травми здаються незначними, адреналін може маскувати біль!</p>
                                </div>
                            </div>

                            <div class="flex flex-col sm:flex-row gap-6 p-6 bg-white border-2 border-slate-200 rounded-3xl shadow-sm relative overflow-hidden">
                                <div class="absolute left-0 top-0 bottom-0 w-2 bg-autumn-500"></div>
                                <div class="text-5xl sm:w-20 text-center">📸</div>
                                <div class="flex-1">
                                    <h3 class="font-bold text-2xl text-slate-800 mb-2">3. Зафіксувати інформацію</h3>
                                    <p class="text-lg text-slate-600">Якщо авто намагається втекти, запам'ятайте або сфотографуйте номерний знак, марку та колір.</p>
                                </div>
                            </div>

                            <div class="grid md:grid-cols-2 gap-6">
                                <div class="flex gap-4 p-6 bg-white border-2 border-slate-200 rounded-3xl shadow-sm">
                                    <div class="text-4xl">👨‍👩‍👧</div>
                                    <div>
                                        <h3 class="font-bold text-xl text-slate-800 mb-1">4. Подзвонити батькам</h3>
                                        <p class="text-base text-slate-600">Повідомте що сталося і де ви знаходитесь.</p>
                                    </div>
                                </div>
                                <div class="flex gap-4 p-6 bg-white border-2 border-slate-200 rounded-3xl shadow-sm">
                                    <div class="text-4xl">👀</div>
                                    <div>
                                        <h3 class="font-bold text-xl text-slate-800 mb-1">5. Шукати свідків</h3>
                                        <p class="text-base text-slate-600">Попросіть дорослих поруч залишитися до поліції.</p>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>
                `
            },
            {
                id: 7,
                title: "7. Підсумок",
                icon: "🏆",
                render: () => {
                    let message = "";
                    let bgColor = "";
                    let emoji = "";
                    
                    if (score <= 2) {
                        message = "Ой-ой! Здається, правила безпеки на дорозі потребують термінового повторення. Будьте уважнішими, ваше життя у ваших руках!";
                        bgColor = "bg-red-50 border-red-200 text-red-800";
                        emoji = "😬";
                    } else if (score <= 4) {
                        message = "Непоганий результат! Ви знаєте основи, але деякі ситуації можуть стати пасткою. Повторіть правила мікромобільності та ефект ніндзя.";
                        bgColor = "bg-blue-50 border-blue-200 text-blue-800";
                        emoji = "👍";
                    } else {
                        message = "Ідеально! Ви справжній експерт з безпеки. Знаєте правила і розумієте фізику дороги. Так тримати!";
                        bgColor = "bg-green-50 border-green-200 text-green-800";
                        emoji = "🌟";
                    }

                    return `
                    <div class="fade-in max-w-4xl mx-auto text-center py-10">
                        <h2 class="text-4xl md:text-5xl font-black text-slate-800 mb-8">
                            🎉 Ваш результат
                        </h2>
                        
                        <div class="inline-block relative mb-10">
                            <div class="w-48 h-48 rounded-full bg-autumn-100 flex items-center justify-center border-8 border-autumn-500 shadow-xl mx-auto">
                                <span class="text-7xl font-black text-autumn-600">${score}/5</span>
                            </div>
                            <div class="absolute -top-4 -right-4 text-6xl animate-bounce">${emoji}</div>
                        </div>

                        <div class="p-8 rounded-3xl border-4 ${bgColor} shadow-lg mb-10">
                            <p class="text-2xl font-bold leading-relaxed">${message}</p>
                        </div>

                        <div class="space-y-4">
                            <p class="text-2xl font-bold text-slate-700">Бажаємо вам завжди безпечних доріг!</p>
                            <p class="text-xl text-slate-500">Пам'ятайте: зелене світло дозволяє рух, але безпеку гарантує лише ваша уважність.</p>
                        </div>

                        <button onclick="navigate(1)" class="mt-10 px-8 py-4 bg-slate-800 text-white font-bold text-xl rounded-2xl hover:bg-slate-700 transition shadow-lg">
                            Почати спочатку
                        </button>
                    </div>
                `
                }
            }
        ];

        // Helper to generate quiz HTML
        function generateQuiz(id, title, desc, answers) {
            let btns = answers.map((ans, idx) => `
                <button onclick="answerQuiz(${id}, ${ans.correct}, this, '${ans.reason.replace(/'/g, "\\'")}')" 
                        class="text-left p-5 text-xl font-medium border-2 border-slate-200 rounded-2xl hover:bg-slate-50 transition w-full shadow-sm mb-3">
                    ${ans.text}
                </button>
            `).join('');

            return `
                <div class="mb-10 border-2 border-slate-200 rounded-3xl overflow-hidden shadow-md bg-white">
                    <div class="bg-slate-100 p-6 border-b-2 border-slate-200">
                        <h3 class="font-bold text-2xl flex items-center gap-3 mb-2">${title}</h3>
                        <p class="text-lg text-slate-700 leading-relaxed"><b>Обставини:</b> ${desc}</p>
                    </div>
                    <div class="p-6" id="quiz-${id}-container">
                        <p class="font-bold mb-4 text-xl text-slate-800">Як діяти правильно?</p>
                        <div class="flex flex-col">
                            ${btns}
                        </div>
                        <div id="quiz-${id}-feedback" class="mt-4 text-xl font-bold hidden p-5 rounded-2xl border-2"></div>
                    </div>
                </div>
            `;
        }

        function initApp() {
            renderNav();
            renderContent();
        }

        function renderNav() {
            const navContainer = document.getElementById('nav-container');
            navContainer.innerHTML = blocks.map(block => `
                <button onclick="navigate(${block.id})" 
                    class="flex items-center gap-4 text-left w-full px-5 py-4 rounded-2xl transition-all duration-200 border-2 ${
                        activeBlockId === block.id 
                        ? 'bg-autumn-500 border-autumn-500 text-white shadow-lg' 
                        : 'bg-white border-transparent text-slate-600 hover:bg-slate-50 hover:border-slate-200'
                    }">
                    <span class="text-3xl">${block.icon}</span>
                    <span class="text-lg md:text-xl font-bold">${block.title.split('. ')[1] || block.title}</span>
                </button>
            `).join('');
        }

        function renderContent() {
            const contentArea = document.getElementById('content-area');
            const block = blocks.find(b => b.id === activeBlockId);
            contentArea.innerHTML = block.render();
            
            // Scroll to top of content area on navigation
            contentArea.scrollTop = 0;

            // Re-initialize specific block scripts
            if(activeBlockId === 1) updateBrakeSim();
        }

        function navigate(id) {
            activeBlockId = id;
            renderNav();
            renderContent();
        }

        // --- Simulator 1 Logic (Braking) ---
        function setWeather(weather) {
            simWeather = weather;
            
            const btnDry = document.getElementById('btn-dry');
            const btnWet = document.getElementById('btn-wet');
            
            if(weather === 'dry') {
                btnDry.className = "flex-1 px-6 py-3 rounded-xl bg-slate-800 text-white text-lg font-bold shadow-md transition";
                btnWet.className = "flex-1 px-6 py-3 rounded-xl bg-slate-200 text-slate-700 hover:bg-slate-300 text-lg font-bold transition";
            } else {
                btnWet.className = "flex-1 px-6 py-3 rounded-xl bg-blue-600 text-white text-lg font-bold shadow-md transition";
                btnDry.className = "flex-1 px-6 py-3 rounded-xl bg-slate-200 text-slate-700 hover:bg-slate-300 text-lg font-bold transition";
            }
            
            updateBrakeSim();
        }

        function updateBrakeSim() {
            const speedSlider = document.getElementById('speed-slider');
            if(!speedSlider) return;
            
            const speed = parseInt(speedSlider.value);
            document.getElementById('speed-val').innerText = speed;

            const reactionDist = speed / 3.6; 
            let brakingDist = Math.pow(speed/10, 2) * 0.5;
            if(simWeather === 'wet') brakingDist *= 2.2; 
            
            const totalDist = Math.round(reactionDist + brakingDist);
            document.getElementById('sim-result').innerText = totalDist;

            const maxVisualMeters = 100;
            let percentage = (totalDist / maxVisualMeters) * 100;
            if(percentage > 92) percentage = 92; 
            
            const car = document.getElementById('sim-car');
            const line = document.getElementById('sim-line');
            
            car.style.transition = 'none';
            car.style.left = '0%';
            
            void car.offsetWidth; 
            
            car.style.transition = 'left 0.8s cubic-bezier(0.25, 1, 0.5, 1)';
            car.style.left = `calc(${percentage}% - 10px)`; 
            
            line.style.width = `${percentage}%`;
            
            const resultText = document.getElementById('sim-result');
            if(totalDist > 40) {
                resultText.className = "text-4xl font-black text-red-600";
                line.className = "absolute top-0 left-0 w-full h-full bg-red-500 opacity-30 transition-all duration-500";
            } else {
                resultText.className = "text-4xl font-black text-autumn-600";
                line.className = "absolute top-0 left-0 w-full h-full bg-autumn-500 opacity-30 transition-all duration-500";
            }
        }

        // --- Simulator 2 Logic (Night Vision) ---
        let hasFlicker = false;
        
        function toggleFlicker(state) {
            hasFlicker = state;
            const btnNoFlicker = document.getElementById('btn-noflicker');
            const btnFlicker = document.getElementById('btn-flicker');
            const pedDark = document.getElementById('ped-dark');
            const pedLight = document.getElementById('ped-light');
            
            if(state) {
                btnFlicker.className = "px-5 py-3 text-lg font-bold bg-autumn-500 text-white rounded-xl shadow-[0_0_15px_rgba(232,122,0,0.8)] transition";
                btnNoFlicker.className = "px-5 py-3 text-lg font-bold bg-slate-700 text-slate-400 rounded-xl hover:bg-slate-600 transition";
                pedDark.style.display = 'none';
                pedLight.style.display = 'block';
            } else {
                btnNoFlicker.className = "px-5 py-3 text-lg font-bold bg-slate-500 text-white rounded-xl transition";
                btnFlicker.className = "px-5 py-3 text-lg font-bold bg-slate-800 text-autumn-500 border-2 border-autumn-500 rounded-xl hover:bg-slate-700 transition";
                pedDark.style.display = 'block';
                pedLight.style.display = 'none';
            }
        }

        function updateFlashlight(clientX, clientY) {
            const mask = document.getElementById('nv-mask');
            const container = document.getElementById('nv-container');
            if(!mask || !container) return;
            
            const rect = container.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;
            
            const radius = hasFlicker ? '250px' : '80px';
            mask.style.background = `radial-gradient(circle ${radius} at ${x}px ${y}px, transparent 0%, rgba(0,0,0,0.98) 100%)`;
        }

        function moveFlashlight(e) { updateFlashlight(e.clientX, e.clientY); }
        function moveFlashlightTouch(e) { 
            e.preventDefault(); 
            updateFlashlight(e.touches[0].clientX, e.touches[0].clientY); 
        }

        document.addEventListener('mouseout', (e) => {
            const container = document.getElementById('nv-container');
            if(container && container.contains(e.target)) {
                 const mask = document.getElementById('nv-mask');
                 if(mask) mask.style.background = `radial-gradient(circle 100px at 50% 50%, transparent 0%, rgba(0,0,0,0.98) 100%)`;
            }
        });

        // --- Quiz Logic (Block 5) ---
        function answerQuiz(quizId, isCorrect, btnElement, reason) {
            const container = document.getElementById(`quiz-${quizId}-container`);
            const feedback = document.getElementById(`quiz-${quizId}-feedback`);
            
            // Score handling
            if (!answeredQuizzes.has(quizId)) {
                if (isCorrect) {
                    score++;
                    document.getElementById('score-display').innerText = score;
                }
                answeredQuizzes.add(quizId);
            }

            // Disable all buttons in this quiz
            const buttons = container.querySelectorAll('button');
            buttons.forEach(b => {
                b.disabled = true;
                b.classList.add('opacity-50', 'cursor-not-allowed');
                b.classList.remove('hover:bg-slate-50', 'border-slate-200');
            });
            
            // Highlight logic
            btnElement.classList.remove('opacity-50');
            
            feedback.style.display = 'block';
            feedback.classList.remove('hidden', 'fade-in');
            void feedback.offsetWidth;
            feedback.classList.add('fade-in');
            
            if(isCorrect) {
                btnElement.classList.add('bg-green-100', 'border-green-500', 'text-green-900', 'shadow-md');
                feedback.className = "mt-5 text-xl p-5 rounded-2xl bg-green-50 border-2 border-green-300 text-green-900 fade-in";
                feedback.innerHTML = `<b>✅ Правильно!</b><br><span class="text-lg font-normal mt-2 inline-block">${reason}</span>`;
            } else {
                btnElement.classList.add('bg-red-100', 'border-red-500', 'text-red-900', 'shadow-md');
                
                // Show the correct answer
                buttons.forEach(b => {
                    if(b.getAttribute('onclick').includes('true')) {
                        b.classList.remove('opacity-50');
                        b.classList.add('border-green-400', 'bg-green-50');
                    }
                });

                feedback.className = "mt-5 text-xl p-5 rounded-2xl bg-red-50 border-2 border-red-300 text-red-900 fade-in";
                feedback.innerHTML = `<b>❌ Помилка!</b><br><span class="text-lg font-normal mt-2 inline-block">${reason}</span>`;
            }
        }

        // Init on load
        document.addEventListener('DOMContentLoaded', initApp);
    </script>
</body>
